<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QA skali portfela</title><style>body{margin:0;background:#d9dce4;font:14px system-ui;color:#17212d}header{padding:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}label{display:flex;align-items:center;gap:6px}select{font:inherit;padding:6px}iframe{display:block;border:0;margin:0 auto;background:#f2f3f7;height:844px}p{margin:0;padding:8px 12px}</style><header><b>Izolowana kontrola skali</b><label>Dokumenty<select id="count"><option>1</option><option selected>4</option><option>12</option><option>20</option><option>30</option></select></label><label>Szerokość<select id="width"><option>320</option><option selected>375</option><option>430</option></select></label></header><iframe title="Portfel testowy" id="qaFrame"></iframe><script>const q=new URLSearchParams(location.search);for(const id of ['count','width'])if(q.has(id))document.getElementById(id).value=q.get(id);function render(){const c=document.getElementById('count').value,w=document.getElementById('width').value,f=document.getElementById('qaFrame');f.style.width=w+'px';f.src=(q.get('surface')==='showcase'?'/pokaz.html':'/qa-scale.html')+'?osoba='+(q.get('osoba')||'marta')+'&count='+c+'&run='+encodeURIComponent(q.get('run')||'')}document.querySelectorAll('select').forEach(s=>s.onchange=render);render()</script></html>
