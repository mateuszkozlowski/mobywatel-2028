<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Przegląd UI — 320, 375, 390 px</title><style>*{box-sizing:border-box}body{font:14px/1.5 Inter,system-ui,sans-serif;color:#172a44;background:#e6e9ef;margin:0;padding:14px 22px}header{display:flex;gap:15px;align-items:center;margin-bottom:12px}h1{font-size:16px;margin:0}button{min-height:36px;padding:5px 13px;border:0;border-radius:18px;background:#fff;color:#30477b;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#304bc4;color:#fff}.board{display:flex;gap:26px;align-items:flex-start}.sample{flex:none}h2{font-size:12px;font-weight:600;margin:0 0 7px}iframe{display:block;height:600px;border:1px solid #b4c0d0;background:#f2f3f7;border-radius:4px}button:focus-visible{outline:3px solid #304bc4;outline-offset:2px}</style></head><body><header><h1>Przegląd responsywny</h1><button aria-pressed="true" data-view="start">Ja</button><button aria-pressed="false" data-view="cases">Sprawy</button><button aria-pressed="false" data-view="history">Historia</button><button aria-pressed="false" data-view="safety">Bezpieczeństwo</button></header><main class="board"><section class="sample"><h2>320 px</h2><iframe width="320" title="Aplikacja — 320 pikseli" src="/aplikacja?osoba=marta&widok=start"></iframe></section><section class="sample"><h2>375 px</h2><iframe width="375" title="Aplikacja — 375 pikseli" src="/aplikacja?osoba=marta&widok=start"></iframe></section><section class="sample"><h2>390 px</h2><iframe width="390" title="Aplikacja — 390 pikseli" src="/aplikacja?osoba=marta&widok=start"></iframe></section></main><script>document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.querySelectorAll('iframe').forEach(f=>f.src='/aplikacja?osoba=marta&widok='+b.dataset.view)})</script></body></html>
